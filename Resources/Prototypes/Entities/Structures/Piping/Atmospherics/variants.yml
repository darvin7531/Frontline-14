- type: entity
  parent: GasVentPump
  id: !type:CreateVariants
    values: [ GasDualPortVentPump, GasDualPortVentPumpAlt1, GasDualPortVentPumpAlt2 ]
  name: dual-port air vent
  description: Has a valve and a pump attached to it. There are two ports, one is an input for releasing air, the other is an output when siphoning.
  categories: !type:CreateVariants
    sequences: [ [ ], [ HideSpawnMenu ], [ HideSpawnMenu ] ]
  placement:
    mode: AlignAtmosPipeLayers
  components:
    - type: SubFloorHide
      visibleLayers:
      - enum.SubfloorLayers.FirstLayer
    - type: Sprite
      drawdepth: FloorObjects
      sprite: Structures/Piping/Atmospherics/vent.rsi
      layers:
        - sprite: !type:CreateVariants
            values: [ Structures/Piping/Atmospherics/pipe.rsi, Structures/Piping/Atmospherics/pipe_alt1.rsi, Structures/Piping/Atmospherics/pipe_alt2.rsi ]
          state: pipeBinaryConnectors
          map: [ "enum.PipeVisualLayers.Pipe" ]
        - state: vent_direction
        - state: vent_off
          map: [ "enabled", "enum.SubfloorLayers.FirstLayer" ]
    - type: AtmosPipeLayers
      spriteRsiPaths: {}
      pipeLayer: !type:CreateVariants
        values: [ 0, 1, 2 ]
    - type: GenericVisualizer
      visuals:
        enum.VentPumpVisuals.State:
          enabled:
            Off: { state: vent_off }
            In: { state: vent_in }
            Out: { state: vent_out }
            Welded: { state: vent_welded }
            Lockout: { state: vent_lockout }
    - type: PipeColorVisuals
    - type: GasVentPump
      inlet: inlet
      outlet: outlet
      canLink: false
    - type: Construction
      graph: !type:CreateVariants
        values: [ GasBinary, GasBinaryAlt1, GasBinaryAlt2 ]
      node: dualportventpump
    - type: NodeContainer
      nodes:
        inlet:
          !type:PipeNode
          nodeGroupID: Pipe
          pipeDirection: North
        outlet:
          !type:PipeNode
          nodeGroupID: Pipe
          pipeDirection: South
    - type: AmbientSound
      enabled: true
    - type: AtmosMonitoringConsoleDevice
      navMapBlip: GasVentOpening
    - type: GuideHelp
      guides:
      - AirVent

- type: entity
  parent: [ BaseMachine, ConstructibleMachine, BaseConstructibleMachineDestructible ]
  id: !type:CreateVariants
    values: [ GasRecycler, GasRecyclerAlt1, GasRecyclerAlt2 ]
  name: gas recycler
  description: Recycles carbon dioxide and nitrous oxide. Heater and compressor not included.
  categories: !type:CreateVariants
    sequences: [ [ ], [ HideSpawnMenu ], [ HideSpawnMenu ] ]
  placement:
    mode: AlignAtmosPipeLayers
  components:
  - type: Sprite
    sprite: Structures/Machines/gasrecycler.rsi
    snapCardinals: true
    granularLayersRendering: true
    layers:
    - sprite: !type:CreateVariants
        values: [ Structures/Piping/Atmospherics/pipe.rsi, Structures/Piping/Atmospherics/pipe_alt1.rsi, Structures/Piping/Atmospherics/pipe_alt2.rsi ]
      state: pipeBinaryConnectors
      map: [ "enum.PipeVisualLayers.Pipe" ]
      renderingStrategy: Default
    - state: running
    - state: unlit
      shader: unshaded
  - type: AtmosPipeLayers
    pipeLayer: !type:CreateVariants
      values: [ 0, 1, 2 ] 
    spriteLayersRsiPaths:
      enum.PipeVisualLayers.Pipe:
        Primary: Structures/Piping/Atmospherics/pipe.rsi
        Secondary: Structures/Piping/Atmospherics/pipe_alt1.rsi
        Tertiary: Structures/Piping/Atmospherics/pipe_alt2.rsi
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.PumpVisuals.Enabled:
        enabled:
          True: { state: running }
          False: { state: unlit }
  - type: PipeColorVisuals
  - type: GasRecycler
  - type: PipeRestrictOverlap
  - type: NodeContainer
    nodes:
      inlet:
        !type:PipeNode
        nodeGroupID: Pipe
        pipeDirection: North
      outlet:
        !type:PipeNode
        nodeGroupID: Pipe
        pipeDirection: South
  - type: AtmosDevice
  - type: AtmosPipeColor
  - type: AmbientSound
    enabled: true
    volume: -9
    range: 5
    sound:
      path: /Audio/Ambience/Objects/gas_pump.ogg
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 175
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
  - type: Machine
    board: GasRecyclerMachineCircuitboard
  - type: AtmosMonitoringConsoleDevice
    navMapBlip: GasValve
  - type: Transform
    noRot: false
  - type: GuideHelp
    guides:
    - GasRecycling
  - type: TegCirculator

# Source: Resources/Prototypes/Entities/Structures/Piping/Atmospherics/gas_pipe_sensor.yml
- type: entity
  parent: [AirSensorBase, GasBinaryBase]
  id: !type:CreateVariants
    values: [ GasPipeSensor, GasPipeSensorAlt1, GasPipeSensorAlt2 ]
  name: gas pipe sensor
  description: Reports on the status of the gas in the attached pipe network.
  categories: !type:CreateVariants
    sequences: [ [ ], [ HideSpawnMenu ], [ HideSpawnMenu ] ]
  placement:
    mode: AlignAtmosPipeLayers
  components:
  - type: Sprite
    sprite: !type:CreateVariants
       values: 
       - Structures/Piping/Atmospherics/gas_pipe_sensor.rsi
       - Structures/Piping/Atmospherics/gas_pipe_sensor_alt1.rsi
       - Structures/Piping/Atmospherics/gas_pipe_sensor_alt2.rsi
    drawdepth: BelowFloor
    layers:
    - sprite: !type:CreateVariants
        values: [ Structures/Piping/Atmospherics/pipe.rsi, Structures/Piping/Atmospherics/pipe_alt1.rsi, Structures/Piping/Atmospherics/pipe_alt2.rsi ]
      map: [ "enum.PipeVisualLayers.Pipe" ]
      state: pipeStraight
    - map: ["base"]
      state: base
    - map: [ "enum.PowerDeviceVisualLayers.Powered" ]
      state: lights
      shader: unshaded
  - type: AtmosPipeLayers
    pipeLayer: !type:CreateVariants
      values: [ 0, 1, 2 ]
    spriteRsiPaths:
      Primary: Structures/Piping/Atmospherics/gas_pipe_sensor.rsi
      Secondary: Structures/Piping/Atmospherics/gas_pipe_sensor_alt1.rsi
      Tertiary: Structures/Piping/Atmospherics/gas_pipe_sensor_alt2.rsi
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        enum.PowerDeviceVisualLayers.Powered:
          False: { state: blank }
          True: { state: lights }
  - type: AtmosMonitor
    monitorsPipeNet: true
  - type: GasPipeSensor
  - type: AtmosMonitoringConsoleDevice
    navMapBlip: GasPipeSensor
  - type: ApcPowerReceiver
  - type: ExtensionCableReceiver
  - type: Construction
    graph: !type:CreateVariants
      values: [ GasPipeSensor, GasPipeSensorAlt1, GasPipeSensorAlt2 ]
    node: sensor
  - type: NodeContainer
    nodes:
      monitored:
        !type:PipeNode
        nodeGroupID: Pipe
        pipeDirection: Longitudinal
  - type: Tag
    tags:
    - AirSensor
    - Unstackable
  - type: GuideHelp
    guides:
    - AtmosphericNetworkMonitor
    - DeviceMonitoringAndControl

