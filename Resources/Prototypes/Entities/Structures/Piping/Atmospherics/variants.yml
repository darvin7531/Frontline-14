- type: entity
  parent: !type:CreateVariants
    sequences: [ [AirSensorVoxBase, GasVentScrubber], [AirSensorVoxBase, GasVentScrubberAlt1], [AirSensorVoxBase, GasVentScrubberAlt2] ]
  id: !type:CreateVariants
    values: [ GasVentScrubberVox, GasVentScrubberVoxAlt1, GasVentScrubberVoxAlt2 ]
  categories: !type:CreateVariants
    sequences: [ [ ], [ HideSpawnMenu ], [ HideSpawnMenu ] ]
  components:
