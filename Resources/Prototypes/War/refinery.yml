- type: frontlineRefineryRecipe
  id: FrontlineSteel
  name: frontline-refinery-recipe-steel
  input:
    FrontlineRawIron: 5
  output:
    Steel: 5
  duration: 5

- type: frontlineRefineryRecipe
  id: FrontlineTechnologyAlloy
  name: frontline-refinery-recipe-technology-alloy
  input:
    RawTechnologyMaterial: 5
  output:
    TechnologyAlloy: 1
  duration: 10

- type: entity
  id: FrontlineRefinery
  parent: BaseStructure
  name: frontline refinery
  description: Processes physical Frontline resources without station infrastructure.
  categories: [ Frontline ]
  components:
  - type: Sprite
    sprite: Structures/Machines/ore_processor.rsi
    state: icon
  - type: FrontlineRefinery
  - type: ActivatableUI
    key: enum.FrontlineRefineryUiKey.Key
  - type: UserInterface
    interfaces:
      enum.FrontlineRefineryUiKey.Key:
        type: FrontlineRefineryBoundUserInterface
  - type: ContainerContainer
    containers:
      inputContainer: !type:Container
