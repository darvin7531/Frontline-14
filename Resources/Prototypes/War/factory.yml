- type: entity
  id: FrontlineFactory
  parent: BaseStructure
  name: frontline factory
  description: Produces physical frontline supplies from refined resources.
  components:
  - type: Sprite
    sprite: Structures/Machines/ore_processor.rsi
    state: icon
  - type: FrontlineFactory
  - type: ActivatableUI
    key: enum.FrontlineFactoryUiKey.Key
  - type: UserInterface
    interfaces:
      enum.FrontlineFactoryUiKey.Key:
        type: FrontlineFactoryBoundUserInterface
  - type: ContainerContainer
    containers:
      inputContainer: !type:Container

- type: entity
  id: FrontlineSupplyCrate
  parent: CrateGenericSteel
  name: frontline supply crate
  description: A public crate for physically transporting frontline supplies.
