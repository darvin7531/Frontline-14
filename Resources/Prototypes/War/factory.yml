- type: frontlineFactoryRecipe
  id: FrontlineFactoryMk58
  category: frontline-ui-category-weapons
  name: frontline-factory-recipe-mk58
  input:
    BasicMaterials: 20
  output: FrontlineFactoryWeaponCrate
  outputAmount: 1
  duration: 10

- type: frontlineFactoryRecipe
  id: FrontlineFactoryMagazinePistol
  category: frontline-ui-category-ammunition
  name: frontline-factory-recipe-magazine-pistol
  input:
    BasicMaterials: 5
  output: FrontlineFactoryAmmoCrate
  outputAmount: 1
  duration: 5

- type: frontlineFactoryRecipe
  id: FrontlineFactoryBrutepack
  category: frontline-ui-category-medical
  name: frontline-factory-recipe-brutepack
  input:
    BasicMaterials: 5
  output: FrontlineFactoryMedicalCrate
  outputAmount: 1
  duration: 5

- type: frontlineFactoryRecipe
  id: FrontlineFactorySupplyCrate
  category: frontline-ui-category-supplies
  name: frontline-factory-recipe-supply-crate
  input:
    BasicMaterials: 10
  output: FrontlineSupplyCrate
  outputAmount: 1
  duration: 5

- type: entity
  id: FrontlineFactory
  parent: BaseStructure
  name: frontline factory
  description: Produces physical frontline supplies from refined resources.
  categories: [ Frontline ]
  components:
  - type: Sprite
    sprite: Structures/Machines/ore_processor.rsi
    state: icon
  - type: FrontlineFactory
  - type: ActivatableUI
    key: enum.FrontlineFactoryUiKey.Key
  - type: UserInterface
    interfaces:
      enum.FrontlineFactoryUiKey.Key:
        type: FrontlineFactoryBoundUserInterface
  - type: ContainerContainer
    containers:
      inputContainer: !type:Container
      outputContainer: !type:Container

- type: entity
  id: FrontlineSupplyCrate
  parent: BaseItem
  name: frontline supply crate
  description: A sealed batch of five soldier supplies for a base stockpile.
  categories: [ Frontline ]
  components:
  - type: Item
    size: Huge
  - type: Sprite
    sprite: Frontline/Structures/Storage/Crates/supply.rsi
    state: icon
  - type: Icon
    sprite: Frontline/Structures/Storage/Crates/supply.rsi
    state: icon
  - type: FrontlineSupplyCrate
    product: SoldierSupplies
    amount: 5

- type: entity
  id: FrontlineFactoryWeaponCrate
  parent: FrontlineWeaponCrate
  name: frontline factory weapon crate
  description: A sealed batch of one unloaded Mk 58 pistol for a base stockpile.
  components:
  - type: FrontlineSupplyCrate
    amount: 1

- type: entity
  id: FrontlineFactoryAmmoCrate
  parent: FrontlineAmmoCrate
  name: frontline factory ammo crate
  description: A sealed batch of one loaded pistol magazine for a base stockpile.
  components:
  - type: FrontlineSupplyCrate
    amount: 1

- type: entity
  id: FrontlineFactoryMedicalCrate
  parent: FrontlineMedicalCrate
  name: frontline factory medical crate
  description: A sealed batch of two trauma treatment packs for a base stockpile.
  components:
  - type: FrontlineSupplyCrate
    amount: 2

- type: entity
  id: FrontlineWeaponPistolMk58
  parent: WeaponPistolMk58
  name: frontline Mk 58
  description: A conventional Mk 58 issued without a magazine for frontline production.
  categories: [ Frontline ]
  components:
  - type: ItemSlots
    slots:
      gun_magazine:
        startingItem: null

- type: entity
  id: FrontlineMagazinePistol
  parent: MagazinePistol
  name: frontline pistol magazine (.35 auto)
  description: A ten-round disposable magazine for frontline pistols.
  categories: [ Frontline ]
  components:
  - type: BallisticAmmoProvider
    proto: FrontlineCartridgePistol
    deleteOnEmpty: true

- type: entity
  id: FrontlineCartridgePistol
  parent: CartridgePistol
  name: frontline cartridge (.35 auto)
  description: A conventional pistol round that leaves no spent casing.
  categories: [ Frontline ]
  components:
  - type: CartridgeAmmo
    deleteOnSpawn: true
