- type: entity
  id: TerritoryMarker
  parent: MarkerBase
  name: territory marker
  components:
  - type: Territory
    territory: Unassigned
    boundsMin: -5,-5
    boundsMax: 5,5

- type: entity
  id: TownHallBase
  abstract: true
  parent: [BaseStructure, StructureHealthMachineWeak]
  name: town hall
  description: Controls its territory while it stands.
  components:
  - type: Anchorable
  - type: Transform
    anchored: true
  - type: TownHall
    territory: Unassigned
    faction: FrontlineFactionOne

- type: entity
  parent: TownHallBase
  id: TownHallCoreFactionOne
  name: faction one town hall
  components:
  - type: TownHall
    faction: FrontlineFactionOne
  - type: Sprite
    sprite: Structures/Furniture/Altars/Gods/nanotrasen.rsi
    state: nanotrasen
  - type: Icon
    sprite: Structures/Furniture/Altars/Gods/nanotrasen.rsi
    state: nanotrasen

- type: entity
  parent: TownHallBase
  id: TownHallCoreFactionTwo
  name: faction two town hall
  components:
  - type: TownHall
    faction: FrontlineFactionTwo
  - type: Sprite
    sprite: Structures/Furniture/Altars/Gods/nanotrasen.rsi
    state: chaos
  - type: Icon
    sprite: Structures/Furniture/Altars/Gods/nanotrasen.rsi
    state: chaos

- type: entity
  id: TownHallRuin
  parent: [BaseStructure, StructureHealthFurniture]
  name: destroyed town hall
  components:
  - type: Anchorable
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: Objects/Materials/Scrap/generic.rsi
    state: metal-1
  - type: Icon
    sprite: Objects/Materials/Scrap/generic.rsi
    state: metal-1
  - type: TownHallRuin
    territory: Unassigned

- type: entity
  id: FactionSpawnPoint
  parent: MarkerBase
  name: faction spawn point
  components:
  - type: FactionSpawnPoint
    territory: Unassigned
