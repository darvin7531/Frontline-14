# Native one-seat driving composition; concrete vehicle types only override data.
# Temporary sprite is referenced in-place: janicart.rsi/meta.json, CC-BY-SA-3.0,
# tgstation commit 40d89d11ea4a5cb81d61dc1018b46f4e7d32c62a. No copied art.
- type: entity
  id: FrontlineVehicleBase
  abstract: true
  categories: [ Frontline ]
  components:
  - type: Sprite
    sprite: Objects/Vehicles/janicart.rsi
    state: vehicle
  - type: Clickable
  - type: InteractionOutline
  - type: InputMover
  - type: MobMover
  - type: MovementSpeedModifier
    baseWalkSpeed: 2
    baseSprintSpeed: 3
    baseAcceleration: 20
    baseFriction: 20
  - type: GravityAffected
  - type: Physics
    bodyType: KinematicController
  - type: Fixtures
    fixtures:
      body:
        shape: !type:PhysShapeCircle
          radius: 0.35
        density: 100
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: Vehicle
  - type: VehicleHandBlocker
    blockedHands: 1
  - type: ContainerVehicle
    containerId: driver
    ejectOperatorOnDisconnect: true
    ejectOperatorOnDeath: true
  - type: ContainerVehicleEntry
    entryDelay: 1
  - type: ContainerContainer
    containers:
      driver: !type:ContainerSlot

- type: entity
  id: FrontlineLogisticsTruck
  parent: FrontlineVehicleBase
  name: frontline logistics truck
  description: A one-driver transport with ten physical cargo slots for sealed supply crates and material stacks.
  components:
  - type: Sprite
    sprite: _Frontline/Vehicles/logistics_truck.rsi
    state: null
    noRot: true
    layers:
    - state: truck_base
    - state: wheels_intact
  - type: Fixtures
    fixtures:
      body:
        shape: !type:PhysShapeCircle
          radius: 0.35
        density: 100
        mask:
        - MobMask
        layer:
        - MobLayer
      pedestrianImpact:
        shape: !type:PhysShapeCircle
          radius: 0.35
        hard: false
        mask:
        - MobLayer
  - type: DamageOnHighSpeedImpact
    damageOther: true
    minimumSpeed: 1.5
    speedDamageFactor: 1
    stunChance: 0
    damageCooldown: 0.5
    soundHit:
      path: /Audio/Effects/metal_thud1.ogg
    damage:
      types:
        Blunt: 25
  - type: VehiclePersistence
  - type: Vehicle
    transferDamage: false
  - type: Damageable
  - type: Injurable
  - type: Destructible
    # Always eject the driver before deletion, including overwhelming damage.
    generateOverkillThreshold: false
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:EmptyContainersBehaviour
        containers: [driver]
      - !type:DoActsBehavior
        acts: [Breakage, Destruction]
  - type: MovementSpeedModifier
    baseWalkSpeed: 3
    baseSprintSpeed: 4.5
  - type: VehicleSurfaceSpeed
    roadTiles: [FloorConcrete, FrontlineFloorAsphalt, FrontlineFloorConcrete, FrontlineFloorAsphalt1, FrontlineFloorAsphalt2, FrontlineFloorAsphalt3, FrontlineFloorAsphalt4, FrontlineFloorAsphalt5, FrontlineFloorAsphalt6, FrontlineFloorAsphalt7, FrontlineFloorAsphalt8, FrontlineFloorAsphalt9, FrontlineFloorAsphalt10, FrontlineFloorAsphalt11, FrontlineFloorAsphalt12, FrontlineFloorAsphalt13, FrontlineFloorAsphalt14, FrontlineFloorAsphalt15, FrontlineFloorAsphalt16, FrontlineFloorAsphalt17, FrontlineFloorAsphaltSunbleached]
    offRoadModifier: 0.55
  - type: FrontlineVehicleCargo
  - type: Storage
    grid:
    - 0,0,19,7
    maxItemSize: Huge
    whitelist:
      components: [FrontlineSupplyCrate, Stack]
    storageInsertSound: null
    storageOpenSound: null
  - type: UserInterface
    interfaces:
      enum.StorageComponent.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: ContainerContainer
    containers:
      driver: !type:ContainerSlot
      storagebase: !type:Container

# No Item component: native hands cannot pick up the entire cargo bag.
- type: entity
  id: FrontlineVehicleLootBag
  categories: [ Frontline ]
  name: vehicle cargo
  description: Salvaged vehicle cargo. Open it to recover individual items.
  components:
  - type: Sprite
    sprite: Clothing/Back/Backpacks/backpack.rsi
    state: icon
  - type: Clickable
  - type: InteractionOutline
  - type: Storage
    grid:
    - 0,0,19,7
    maxItemSize: Huge
    storageInsertSound: null
    storageOpenSound: null
  - type: UserInterface
    interfaces:
      enum.StorageComponent.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
