# Native one-seat driving composition; concrete vehicle types only override data.
# Temporary sprite is referenced in-place: janicart.rsi/meta.json, CC-BY-SA-3.0,
# tgstation commit 40d89d11ea4a5cb81d61dc1018b46f4e7d32c62a. No copied art.
- type: entity
  id: FrontlineVehicleBase
  abstract: true
  categories: [ Frontline ]
  components:
  - type: Sprite
    sprite: Objects/Vehicles/janicart.rsi
    state: vehicle
  - type: Clickable
  - type: InteractionOutline
  - type: InputMover
  - type: MobMover
  - type: MovementSpeedModifier
    baseWalkSpeed: 2
    baseSprintSpeed: 3
    baseAcceleration: 20
    baseFriction: 20
  - type: GravityAffected
  - type: Physics
    bodyType: KinematicController
  - type: Fixtures
    fixtures:
      body:
        shape: !type:PhysShapeCircle
          radius: 0.35
        density: 100
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: Vehicle
  - type: VehicleHandBlocker
    blockedHands: 1
  - type: ContainerVehicle
    containerId: driver
    ejectOperatorOnDisconnect: true
    ejectOperatorOnDeath: true
  - type: ContainerVehicleEntry
    entryDelay: 1
  - type: ContainerContainer
    containers:
      driver: !type:ContainerSlot

- type: entity
  id: FrontlineLogisticsTruck
  parent: FrontlineVehicleBase
  name: frontline logistics truck
  description: A one-driver transport with ten physical cargo slots for sealed supply crates and material stacks.
  components:
  - type: Sprite
    sprite: _Frontline/Vehicles/logistics_truck.rsi
    state: null
    noRot: true
    layers:
    - state: truck_base
    - state: wheels_intact
  - type: Fixtures
    fixtures:
      body:
        shape: !type:PhysShapeCircle
          radius: 0.35
        density: 100
        mask:
        - MobMask
        layer:
        - MobLayer
      pedestrianImpact:
        shape: !type:PhysShapeCircle
          radius: 0.35
        hard: false
        mask:
        - MobLayer
  - type: DamageOnHighSpeedImpact
    damageOther: true
    minimumSpeed: 1.5
    speedDamageFactor: 1
    stunChance: 0
    damageCooldown: 0.5
    soundHit:
      path: /Audio/Effects/metal_thud1.ogg
    damage:
      types:
        Blunt: 25
  - type: VehiclePersistence
  - type: Vehicle
    transferDamage: false
  - type: Damageable
  - type: Injurable
  - type: Destructible
    # Always eject the driver before deletion, including overwhelming damage.
    generateOverkillThreshold: false
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:EmptyContainersBehaviour
        containers: [driver]
      - !type:DoActsBehavior
        acts: [Breakage, Destruction]
  - type: MovementSpeedModifier
    baseWalkSpeed: 3
    baseSprintSpeed: 4.5
  - type: VehicleSurfaceSpeed
    roadTiles: [FloorConcrete, FrontlineFloorAsphalt, FrontlineFloorConcrete, FrontlineFloorAsphalt1, FrontlineFloorAsphalt2, FrontlineFloorAsphalt3, FrontlineFloorAsphalt4, FrontlineFloorAsphalt5, FrontlineFloorAsphalt6, FrontlineFloorAsphalt7, FrontlineFloorAsphalt8, FrontlineFloorAsphalt9, FrontlineFloorAsphalt10, FrontlineFloorAsphalt11, FrontlineFloorAsphalt12, FrontlineFloorAsphalt13, FrontlineFloorAsphalt14, FrontlineFloorAsphalt15, FrontlineFloorAsphalt16, FrontlineFloorAsphalt17, FrontlineFloorAsphaltSunbleached]
    offRoadModifier: 0.55
  - type: ContainerContainer
    containers:
      driver: !type:ContainerSlot
      cargo01: !type:ContainerSlot
      cargo02: !type:ContainerSlot
      cargo03: !type:ContainerSlot
      cargo04: !type:ContainerSlot
      cargo05: !type:ContainerSlot
      cargo06: !type:ContainerSlot
      cargo07: !type:ContainerSlot
      cargo08: !type:ContainerSlot
      cargo09: !type:ContainerSlot
      cargo10: !type:ContainerSlot
  # ItemSlots ensures one ContainerSlot per entry; no grid-size limit on Huge crates.
  # No swapping: loading a full truck must not replace an existing paid cargo entity.
  - type: ItemSlots
    slots:
      cargo01:
        priority: 1
        swap: false
        insertSound: null
        ejectSound: null
        ejectOnBreak: true
        whitelist:
          components:
          - FrontlineSupplyCrate
          - Stack
      cargo02:
        priority: 2
        swap: false
        insertSound: null
        ejectSound: null
        ejectOnBreak: true
        whitelist:
          components:
          - FrontlineSupplyCrate
          - Stack
